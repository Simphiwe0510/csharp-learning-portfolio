name: C# coursework build verification
on:
  push:
    branches: [main, portfolio-2025-reviewed]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - HourlyWorkerOOP/AbstractWorker.csproj
          - 01-Programming-Fundamentals/Tutorial-02/Question-01/Question01.csproj
          - 02-Object-Oriented-Programming/Tutorial-06/Question-01/Question01.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore "${{ matrix.project }}"
      - name: Build
        run: dotnet build "${{ matrix.project }}" --no-restore --configuration Release
